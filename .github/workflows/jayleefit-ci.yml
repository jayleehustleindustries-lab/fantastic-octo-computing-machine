name: JayLeeFit CI

on:
  push:
    branches: [main, jayleefit-launch, staging]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      # Version comes from "packageManager" in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Test
        run: pnpm test -- --pool=threads --poolOptions.threads.singleThread=true --maxConcurrency=1

      - name: Build
        run: pnpm build
